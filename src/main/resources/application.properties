spring.application.name=Ecom

# Use H2 in-memory DB for development. Replace with your DB URL/creds for production.
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensure SQL init scripts (data.sql) are always run (Spring Boot 2.5+)
spring.sql.init.mode=always

# Defer datasource initialization until after JPA has created/updated the schema
spring.jpa.defer-datasource-initialization=true

# Backwards compatibility for older Spring Boot versions (optional)
# spring.datasource.initialization-mode=always

# JWT settings
jwt.secret=change_this_to_a_long_secret_key_change_in_prod
jwt.expirationMs=3600000

# CORS allowed origins (frontend running on localhost:3000)
cors.allowedOrigins=http://localhost:3000
